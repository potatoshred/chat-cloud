worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 4k;
    client_body_timeout 10s;

    # Re-resolve auth after container replacement instead of caching its old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # All writable paths live in /tmp so the container can use a read-only root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The external HTTPS proxy must overwrite X-Forwarded-Proto. The published port is loopback only.
    map $http_x_forwarded_proto $public_scheme {
        default $scheme;
        https https;
        http http;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        set $auth_backend http://auth:3000;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

        location = /healthz {
            access_log off;
            proxy_pass $auth_backend/healthz;
        }

        # Favicons must also load on the public login page.
        location = /favicon.ico {
            try_files $uri =404;
        }

        location = /favicon.svg {
            try_files $uri =404;
        }

        location = /_auth_check {
            internal;
            proxy_pass $auth_backend/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }

        location = /login {
            proxy_pass $auth_backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header Cookie $http_cookie;
        }

        location = /logout {
            proxy_pass $auth_backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header Cookie $http_cookie;
        }

        location /auth/ {
            access_log off;
            proxy_pass $auth_backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
        }

        location /api/ {
            access_log off;
            client_max_body_size 32m;
            client_body_timeout 120s;
            proxy_pass $auth_backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 120s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_http_version 1.1;
        }

        location /data/ {
            access_log off;
            client_max_body_size 64m;
            client_body_timeout 120s;
            proxy_pass $auth_backend$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_request_buffering off;
            proxy_http_version 1.1;
        }

        location @login_required {
            return 303 /login;
        }

        location /static/ {
            auth_request /_auth_check;
            try_files $uri =404;
        }

        location / {
            auth_request /_auth_check;
            error_page 401 = @login_required;
            try_files $uri $uri/ /index.html;
        }
    }
}
