services:
  chat:
    image: deepseek-chat-demo:local
    build:
      context: .
      target: runtime
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  auth:
    image: deepseek-chat-auth:local
    build:
      context: .
      target: auth
    environment:
      AUTH_USERNAME: "${AUTH_USERNAME:-admin}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:?请在 .env 中设置 AUTH_PASSWORD，至少 14 个字符}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:?请在 .env 中设置 DEEPSEEK_API_KEY}"
      DEEPSEEK_API_BASE_URL: "${DEEPSEEK_API_BASE_URL:-https://api.deepseek.com}"
    volumes:
      - chat_data:/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # 可选：Cloudflare Tunnel。取消下方服务注释，并在 .env 设置 CLOUDFLARE_TUNNEL_TOKEN。
  # 在 Cloudflare 中配置公网主机名，服务地址填写 http://chat:8080。
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?请在 .env 中设置 CLOUDFLARE_TUNNEL_TOKEN}"
  #   depends_on:
  #     chat:
  #       condition: service_started
  #   restart: unless-stopped
  #   read_only: true
  #   cap_drop:
  #     - ALL
  #   security_opt:
  #     - no-new-privileges:true

networks:
  default:
    ipam:
      config:
        - subnet: "${CHAT_SUBNET:-172.29.255.0/24}"

volumes:
  chat_data:
